name: Construire l'appli

# Pousse un tag (ex : git tag v1.0.0 && git push --tags) pour créer une release
# avec les installeurs Windows / macOS / Linux. Le bouton "Run workflow" de
# l'onglet Actions construit aussi les installeurs (téléchargeables en "artifacts").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: LiveChat-${{ matrix.os }}
          path: |
            client/dist/*.exe
            client/dist/*.dmg
            client/dist/*.AppImage
          if-no-files-found: ignore
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/dist/*.exe
            client/dist/*.dmg
            client/dist/*.AppImage
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
