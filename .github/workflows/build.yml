name: Construire l'appli

# Construit les installeurs pour tester une branche (téléchargeables en "artifacts")
# et lance les tests du serveur. Pour publier une mise à jour aux amis, utilise
# plutôt « Publier une mise à jour » (release.yml).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: LiveChat-${{ matrix.os }}
          path: |
            client/dist/*.exe
            client/dist/*.dmg
            client/dist/*.AppImage
          if-no-files-found: ignore
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
